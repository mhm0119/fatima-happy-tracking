<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b4d">
<style>
:root{--c:#176b4d;--s:#eaf6f0}*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#17211d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif}.app{max-width:620px;min-height:100vh;margin:auto;background:#fff}header{padding:22px 20px 18px;color:#fff;background:linear-gradient(135deg,var(--c),#2b9c72)}header small{font-weight:700;opacity:.85}h1{margin:5px 0 0;font-size:25px}main{padding:20px 18px 36px}.pill{display:inline-block;padding:7px 12px;border-radius:99px;color:var(--c);background:var(--s);font-weight:800}h2{margin:14px 0 8px;font-size:26px;line-height:1.3}.desc{margin:0 0 18px;color:#3f4b46;font-size:17px;line-height:1.65}.pic{position:relative;overflow:hidden;aspect-ratio:4/3;border-radius:18px;background:#e9edeb}.pic img{width:100%;height:100%;object-fit:cover;display:block}.pic.example{aspect-ratio:auto;background:#fff}.pic.example img{height:auto;object-fit:contain}.tag{position:absolute;z-index:2;top:12px;left:12px;padding:6px 10px;border-radius:99px;color:#fff;background:#000a;font-size:13px;font-weight:800}.notice{margin:16px 0;padding:14px;border-radius:13px;background:#f2f5f3;line-height:1.5}.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;color:#fff;background:var(--c);font-size:18px;font-weight:900;text-align:center;cursor:pointer}.sub{margin-top:10px;color:var(--c);background:var(--s)}input{display:none}.staff{margin-top:15px;padding:15px;border:2px solid var(--c);border-radius:14px;color:var(--c);text-align:center;font-weight:900}.time{text-align:center;color:#66716c;font-size:13px}.reset{margin-top:24px;color:#777;background:none;text-decoration:underline;font-size:13px}.err{padding:20px;color:#9b2525;text-align:center}.viewer{position:fixed;z-index:99;inset:0;padding:18px;background:#000d;overflow:auto}.viewer img{display:block;width:100%;max-width:620px;height:auto;margin:58px auto 18px;border-radius:12px;background:#fff}.viewer .close{position:fixed;z-index:100;top:12px;right:18px;width:auto;padding:10px 18px;background:#fff;color:#17211d}footer{padding:0 18px 24px;color:#7a837f;text-align:center;font-size:12px}
</style></head><body><div class="app"><header><small>CHANGWON FATIMA HOSPITAL</small><h1>파티마, 행복 트래킹</h1></header><main id="main"><div class="notice">미션을 불러오는 중입니다.</div></main><footer>안전한 장소에 멈춘 뒤 사진을 촬영해 주세요.</footer></div>
<script>
const PARAMS=new URLSearchParams(location.search),INIT=PARAMS.get('stage'),TEST=PARAMS.get('test')==='1',VER='test-6';
const IMG={
walk:['1S1Zoi0LLa5f6PrFvPJppPg3F_al4b9pu','1RZncVeiz-CZNIjV5kNFHbo-xnVZJF5FR','1lcy20CudRDwMkFrqgKymLnS7FkxJdSzG','1cpNoU-GRdbKDOucQWsZGJY3qop4brqqO','1MkfJA2VVdRq813mUDo-Y1h2yzoua30uW','1l0PNswVBv4gXKAUJgQ43in5GRCes1ctB'],
smile:['1y7Fv7hCy771FMUlRxNE87d1nVFTujeYu','1RX2i4j3xEfjtmDbGUqwsTB_p9bbrx4Cn','1LNEgG-VWjv0LMDxWAqrNqCgLCrBBFWHX','1580O1bG-klL_5qqe1WPS2WcN12zTKXD7','1mLfh8bzYdp1Pt4PGqfOf8CicDHA9IoZd','1FvCKjca8EJSAi0sK4HiZMcGn8w4EDfy_'],
together:['1yQMePGifGOflnW26neBj9G9VtZMQAvCa','1K41lC4D_3SmMv3EQuDMS9_otXsY76oLr','1ot19myrMC05aIiuDu4R-fKzQuIo1bYQb','1IUSNkZRI0Ta3qgn54cw5jmEzxiyd1XCW','1yJWYtOTVS2ZGg22jHUMpiaUvDQnKkyBf','19f1ccEUdgJvezH5GRmWnintRY8KoWuPn','1DRRsadgpEQ6qVUf4DS_Bh1g2cyXjN7tx','1EWaCIq5CSamXshNMpWo6vRW4wSIsKfwV'],
happy:['1nomNBSxYDXy2MS0quYp2Ai5NxSQME_k8','1lnzbvzxjLcVHYgCjiQ6u3-YneBcFDg8I','1-jhxil_kJxxzgHR51hurteORPXBHYSyl','1hk27qGw7iy7AJFl4ymhoC6UQhflz7cgc','1xT0iryb4wyO3NjtYGTL61g-6X6L0pirx','1rvbffnODN2eqgvL3iIlDpNYiweSQqCpv','1zVcAq06Z2fYGen9vBl2jHNvwKKFPY0kp','13kyrKhLiMFot6p9aDUazXvDYmBluNABu']
};
function imgUrl(st,i){
return 'https:'+String.fromCharCode(47,47)+'drive.google.com/thumbnail?id='+encodeURIComponent(IMG[st][i])+'&sz=w1200';
}
const S={
walk:{n:1,name:'걷고',c:'#16734f',s:'#e8f5ef',m:[['발 5개 이상','함께 걷는 사람들의 발이 5개 이상 보이도록 촬영해 주세요.'],['뒤돌아보며 손 흔드는 출발 장면','앞으로 걸어가다가 뒤돌아보며 손을 흔드는 모습을 촬영해 주세요.'],['서로 손잡고 걷기','두 사람 이상이 서로 손을 잡고 걷는 모습을 촬영해 주세요.'],['3명 이상 나란히 걷기','세 명 이상이 나란히 걷는 모습을 옆에서 촬영해 주세요.'],['거인발(엄지요정)','카메라 가까이에 발이나 엄지를 두어 재미있는 원근감 사진을 촬영해 주세요.'],['2인 이상 MZ샷 정수리샷','두 명 이상이 머리를 가운데로 모아 정수리가 보이도록 촬영해 주세요.']]},
smile:{n:2,name:'웃고',c:'#e49a00',s:'#fff5d9',m:[['활짝 웃는 사진','치아가 5개 이상 보이도록 활짝 웃는 모습을 촬영해 주세요.'],['한 명만 무표정','한 명만 무표정을 짓고 나머지는 모두 웃는 사진을 촬영해 주세요.'],['서로의 볼 잡기','두 사람이 마주 보며 서로의 볼을 잡고 있는 사진을 촬영해 주세요.'],['입꼬리 올려 웃기','손가락으로 입꼬리를 올리며 웃는 모습을 촬영해 주세요.'],['얼굴 가까이 V자','손가락 V자를 얼굴 가까이 대고 웃는 모습을 촬영해 주세요.'],['누가 봐도 웃긴 포즈','누가 봐도 웃을 수 있는 재미있는 포즈로 촬영해 주세요.']]},
together:{n:3,name:'함께하고',c:'#2868b2',s:'#eaf2fc',m:[['병원 외 사람과 사진 찍기','병원 직원이 아닌 사람에게 양해를 구하고 함께 사진을 촬영해 주세요.'],['그림자 사진','두 명 이상의 그림자가 함께 보이도록 촬영해 주세요.'],['자연·조형물과 함께','식물, 동물 또는 조형물과 함께 사진을 촬영해 주세요.'],['파티마 키링과 함께','파티마 키링이 사진에 보이도록 함께 촬영해 주세요.'],['손가락 57개','여러 사람의 손가락이 모두 합쳐 57개가 보이도록 촬영해 주세요.'],['2명 이상 팔짱 끼고 걷기','두 명 이상이 팔짱을 끼고 걷는 모습을 촬영해 주세요.'],['같은 방향 가리키기','다섯 명 이상이 모두 같은 방향을 가리키는 사진을 촬영해 주세요.'],['3명 이상 동시 점프','세 명 이상이 동시에 점프하는 순간을 촬영해 주세요.']]},
happy:{n:4,name:'행복하고',c:'#d74478',s:'#fdebf2',m:[['먹거나 먹여주는 사진','무언가를 맛있게 먹거나 서로 먹여주는 모습을 촬영해 주세요.'],['조형물과 같은 포즈','주변 조형물을 찾아 조형물과 똑같은 포즈로 촬영해 주세요.'],['자연 속 하트 찾기','자연 속에서 하트 모양을 찾아 촬영해 주세요.'],['세 사람 이상 같은 포즈','세 사람 이상이 모두 같은 포즈를 취해 촬영해 주세요.'],['발이 땅에서 떨어진 점프샷','사진 속 사람들의 발이 모두 땅에서 떨어진 순간을 촬영해 주세요.'],['원근법 착시 사진','원근법을 이용해 재미있는 착시 사진을 촬영해 주세요.'],['눈 감고 바람 느끼기','눈을 감고 바람을 맞으며 세상에서 가장 편안한 표정을 촬영해 주세요.'],['3명 이상 큰 하트','세 명 이상이 몸이나 팔로 큰 하트를 만들어 촬영해 주세요. 손하트는 제외입니다.']]}
};
const MEM={},CARD_CACHE={};
function get(k){try{let v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return MEM[k]??null}
function set(k,v){MEM[k]=String(v);try{localStorage.setItem(k,String(v))}catch(e){}}
function del(k){delete MEM[k];try{localStorage.removeItem(k)}catch(e){}}
function mk(st,t){return`fatima-${VER}-${t}-${st}`}
function pick(st){let k=mk(st,'mission'),v=get(k),i=v===null?NaN:Number(v);if(Number.isInteger(i)&&i>=0&&i<S[st].m.length)return i;i=Math.floor(Math.random()*S[st].m.length);set(k,i);return i}
function theme(st){let x=S[st];document.documentElement.style.setProperty('--c',x.c);document.documentElement.style.setProperty('--s',x.s)}
function photo(st){try{return JSON.parse(get(mk(st,'photo'))||'null')}catch(e){return null}}
function show(st){theme(st);let x=S[st],i=pick(st),a=x.m[i],p=photo(st);main.innerHTML=p?done(st,a,p):mission(st,x,a,i);bind(st)}
function home(){theme('walk');let cards=Object.keys(S).map(st=>{let x=S[st],started=get(mk(st,'mission'))!==null;return started?`<button class="btn sub" data-stage="${st}">MISSION ${x.n} · ${x.name} 다시보기</button>`:`<div class="notice">🔒 MISSION ${x.n} · ${x.name} — 체크포인트 미방문</div>`}).join('');main.innerHTML=`<span class="pill">내 미션 다시보기</span><h2>행복 트래킹 진행현황</h2><p class="desc">이미 발급받은 미션과 촬영사진만 다시 열 수 있습니다.</p>${cards}`;document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>show(b.dataset.stage))}
function mission(st,x,a,i){return`<span class="pill">MISSION ${x.n} · ${x.name}</span><h2>${a[0]}</h2><p class="desc">${a[1]}</p><div class="pic example"><span class="tag">예시 사진</span><img src="${imgUrl(st,i)}" alt="예시 사진" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<div class=err>예시사진을 불러오지 못했습니다.<br>Drive 공유 설정을 확인해 주세요.</div>')"></div><div class="notice">예시와 똑같이 찍지 않아도 됩니다. 미션의 핵심 조건이 보이도록 촬영해 주세요.</div><label class="btn" for="cam">사진 촬영하기</label><input id="cam" type="file" accept="image/*" capture="environment">`}
function done(st,a,p){let t=p.time?new Date(p.time).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';return`<h2>${a[0]}</h2><p class="desc">${a[1]}</p><div class="pic"><span class="tag">실제 촬영 사진</span><img src="${p.data}" alt="촬영 사진"></div><p class="time">${t?'촬영시각 '+t:''}</p><button class="btn" id="saveBtn" type="button">${get(mk(st,'saved'))==='1'?'저장완료':'미션사진 저장하기'}</button><label class="btn sub" for="cam">다시 촬영하기</label><input id="cam" type="file" accept="image/*" capture="environment"><div class="staff">저장한 미션사진을 다음 장소의 스탭에게 보여주세요.</div>`}
function bind(st){let c=document.getElementById('cam');if(c)c.onchange=async e=>{let f=e.target.files&&e.target.files[0];if(!f)return;try{let d=await resize(f);delete CARD_CACHE[st];del(mk(st,'saved'));set(mk(st,'photo'),JSON.stringify({data:d,time:Date.now()}));show(st)}catch(x){alert('사진을 처리하지 못했습니다. 다시 촬영해 주세요.')}};let b=document.getElementById('saveBtn');if(b){prepareCard(st);b.onclick=async()=>{try{if(get(mk(st,'saved'))==='1'){await showSavedCard(st);return}b.disabled=true;b.textContent='저장 중...';await saveCard(st);set(mk(st,'saved'),'1');b.textContent='저장완료';b.disabled=false}catch(e){b.disabled=false;b.textContent='미션사진 저장하기';alert('사진을 저장하지 못했습니다. 다시 시도해 주세요.')}}}}
function wrap(g,text,x,y,max,line){let s='',n=0;for(let ch of text){let t=s+ch;if(g.measureText(t).width>max&&s){g.fillText(s,x,y+n*line);s=ch;n++}else s=t}if(s)g.fillText(s,x,y+n*line);return n+1}
function prepareCard(st){if(!CARD_CACHE[st])CARD_CACHE[st]=createCard(st).catch(e=>{delete CARD_CACHE[st];throw e});return CARD_CACHE[st]}
function createCard(st){return new Promise((ok,no)=>{let x=S[st],a=x.m[pick(st)],p=photo(st);if(!p)return no(Error('저장할 사진이 없습니다.'));let im=new Image;im.onerror=()=>no(Error('촬영사진을 불러오지 못했습니다.'));im.onload=()=>{let w=1200,head=480,pad=90,border=12,pw=w-(pad+border)*2,h=Math.round(im.height*pw/im.width),c=document.createElement('canvas'),g=c.getContext('2d');c.width=w;c.height=head+h+(pad+border)*2;g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle=x.c;g.fillRect(0,0,w,125);g.fillStyle='#fff';g.font='bold 44px sans-serif';g.fillText(`MISSION ${x.n} · ${x.name}`,55,80);g.fillStyle='#17211d';g.font='bold 72px sans-serif';let titleLines=wrap(g,a[0],55,225,1090,84);g.fillStyle='#3f4b46';g.font='40px sans-serif';wrap(g,a[1],55,225+titleLines*84+12,1090,56);let bx=pad,by=head+pad,bw=w-pad*2,bh=h+border*2;g.fillStyle=x.c;g.fillRect(bx,by,bw,bh);g.drawImage(im,bx+border,by+border,pw,h);c.toBlob(blob=>blob?ok(blob):no(Error('저장 이미지를 만들지 못했습니다.')),'image/jpeg',.88)};im.src=p.data})}
async function saveCard(st){await prepareCard(st)}
async function showSavedCard(st){let blob=await prepareCard(st),u=URL.createObjectURL(blob),v=document.createElement('div');v.className='viewer';v.innerHTML=`<button class="btn close" type="button">닫기</button><img src="${u}" alt="저장한 미션사진">`;document.body.appendChild(v);let close=()=>{URL.revokeObjectURL(u);v.remove()};v.querySelector('.close').onclick=close;v.onclick=e=>{if(e.target===v)close()}}
function preview(src){let w=window.open();if(w){w.document.write(`<meta name="viewport" content="width=device-width"><body style="margin:0;background:#111;text-align:center"><p style="color:white;font-family:sans-serif">이미지를 길게 눌러 사진에 저장하세요.</p><img src="${src}" style="max-width:100%"></body>`)}else alert('팝업 차단을 해제한 뒤 다시 시도해 주세요.')}
function resize(f){return new Promise((ok,no)=>{let r=new FileReader;r.onerror=no;r.onload=()=>{let i=new Image;i.onerror=no;i.onload=()=>{let q=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*q);c.height=Math.round(i.height*q);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(f)})}
try{if(TEST&&INIT&&S[INIT]){del(mk(INIT,'mission'));del(mk(INIT,'photo'));del(mk(INIT,'saved'));delete CARD_CACHE[INIT]}INIT&&S[INIT]?show(INIT):home()}catch(e){main.innerHTML=`<div class="err"><b>미션 화면 오류</b><br><br>${e.message||e}</div>`;console.error(e)}
</script></body></html>
